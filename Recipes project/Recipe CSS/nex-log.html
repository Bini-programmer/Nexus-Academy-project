<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="nexus.css">
    <title>Nexus Academy</title>

</head>

<body>
    <header></header>


    <main class="mixed-format">
        <section class="description">
            <div>
                <h1>NEXUS</h1>
                <h2> ACADEMY</h2>
            </div>
            <div>
                <h3>Learn. Innovate. Elevate.</h3>


                <p>Welcome back! Login to continue <br> your learning journey and unlock <br> new opportunities.</p>
            </div>
        </section>

        <article class="formats">
            <div>
                <h2>Welcome Back</h2>
                <p>Login to your Nexus Academy account.</p>
            </div>
            <div>
                <form action="#">
                    <label for="email address">Email Address:</label>
                    <input type="email" id="email" name="email address" placeholder="enter your email" required>
                    <br>
                    <label for="password">Password:</label> <br>
                    <input class="log-pass" type="password" id="password" name="password"
                        placeholder="enter your password" required>
                    <a id="pass" href="www.nexusacademy.com/password"><br> Forgot Password?</a> <br>
                    <button type="text" id="login" name="login" required>Login</button>
                    <p id="or">Or</p>
                    <button class="with-goo">Continue with Google</button>
                    <p class="signup">Don't have an account? <a href="../../index.html">Sign up here.</a></p>
                </form>
            </div>
        </article>
        <aside>
        </aside>

    </main>

    <footer></footer>

</body>

</html>
