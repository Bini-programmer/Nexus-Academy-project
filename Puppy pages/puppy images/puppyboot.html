<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Bootstrap file/bootstrap.css">
    <link rel="stylesheet" href="./puppyboot.css">
    <title>Bootstrap Puppy Page</title>
</head>
<body>
    <!-- the banner -->
    <header class="text-center py-3 header">
        <h1>Puppy Lovers Page</h1>
    </header>
    <main>
        <section>
            <div>
                <img src="./banner-puppies.jpg" alt="Cute Puppy 1">
            </div>
        </section>
        <!-- the three puppy and missing puppy images -->
        <section class="container my-4">
            <div class="row gap-3"> 
            <div class="mb-4 col-md mb-md-0 ">
                <img src="./puppy-1.jpg" alt="best puppy">
            </div>
            <div class="d-none d-md-block col-md missing">
                <p class="fs-3 fw-bold text-center align-items-center p-4"> We Have A Missing Puppy!</p>
            </div>
            <div class="col-md">
                <img src="./puppy-2.jpg" alt="Cute Puppy 2">
            </div>
            </div>
        </section>
        <section class="text-center">
            <h2>More Puppies</h2>
        </section>
        <!-- the two additional puppy images -->
        <section class="container my-4">
            <div class="row gap-3">
            <div class="mt-4 col-md">
                <img src="./puppy-3.jpg" alt="Cute Puppy 3">
            </div>
            <div class="mb-4 mt-4 col-md">
                <img src="./puppy-4.jpg" alt="Cute Puppy 4">
            </div>
            </div>
        </section>
    </main>
    <!-- the footer -->
    <footer class="text-center py-3 footer">
        <p>Developed by: Binyam.</p>
        <p>&copy; 2026 Puppy Lovers Page. All rights reserved.</p>
    </footer>
</body>
</html>
